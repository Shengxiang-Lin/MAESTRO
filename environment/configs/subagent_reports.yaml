# Stage 2: always rebuild the deterministic Macro Oracle, then review its
# Sub-Agent reports. Source paths are derived from reporting.output_dir/oracle;
# never maintain a second, potentially stale Oracle path in the YAML.
version: 1

implementation:
  scenes: environment/data/batches/candidate_500/stage1/questions/scenes.jsonl
  output_dir: environment/data/batches/candidate_500/stage2/oracle
  max_records: 500  # standalone Oracle capacity; CLI uses reporting.max_scenes
  evidence_limit: 12
  strict_replay: true
  overwrite: false
  no_progress: false

reporting:
  output_dir: environment/data/batches/candidate_500/stage2
  api_base: http://127.0.0.1:8807/v1
  model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: local-qwen3.5-9b
  api_key_env: null
  critic_api_key_env: null
  workers: 10
  max_revisions: 2
  flush_every: 1
  timeout: 180
  max_scenes: 500
  no_progress: false
  overwrite: false
