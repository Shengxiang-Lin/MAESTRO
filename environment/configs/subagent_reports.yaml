# Materialize trusted evidence traces and naturalize Sub-Agent reports.
# All paths are relative to the repository root.
version: 1

implementation:
  # Must match questions.yaml generation.output_dir + /questions/scenes.jsonl.
  scenes: environment/data/maestro_stage1_current_v1_3_100/questions/scenes.jsonl
  output_dir: environment/data/maestro_stage2_oracle_current_v1_3_100
  max_records: null
  evidence_limit: 12
  strict_replay: true
  overwrite: false
  no_progress: false


# Naturalize the frozen Oracle Macro results in the style
# of a real Sub-Agent's finish(result/status/summary) to Main-Agent.
# This NEVER changes structured answer or teacher evidence.
reporting:
  source_subtasks: environment/data/maestro_stage2_oracle_current_v1_3_100/subtasks.jsonl
  source_scene_index: environment/data/maestro_stage2_oracle_current_v1_3_100/scene_index.jsonl
  output_dir: environment/data/maestro_stage2_reports_current_v1_3_100
  api_base: http://127.0.0.1:8807/v1
  model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: null
  api_key_env: null
  critic_api_key_env: null
  workers: 8
  max_revisions: 2
  flush_every: 1  # save accepted/rejected Macro reviews + checkpoint as they finish
  timeout: 180
  max_scenes: null
  no_progress: false
  overwrite: false
