# Current opt-in: one Task Plan -> direct real/synthetic World -> old Compiler/Replay.
# Uses the SAME World/Program/Quality/Replay pipeline as the v2 scenes.
# Source media and dossier cards remain explicitly simulated. Real YAGO
# witnesses are preferred, but when a complete causal relation cannot be
# grounded, the generator builds an explicitly fictional semantic world.
version: 1

input:
  mmqa: data/world-source/MultiModalQA/MMQA_train.jsonl.gz  # unused in this mode
  max_records: 1000

generation:
  output_dir: environment/data/stage1_single_task_plan_pilot
  target: 20
  seed: 17
  difficulty_mix: [0, 50, 50]
  overwrite: false
  flush_every: 1
  no_progress: false
  macro_planning_share: 100
  knowledge_variant: task_plan
  knowledge_yago: data/world-source/YAGO-4.6
  knowledge_max_triples: 1000000
  knowledge_max_edges: 250000
  knowledge_min_hops: 2
  knowledge_max_hops: 3

scenario:
  api_base: null
  model: null
  critic_api_base: null
  critic_model: null
  api_key_env: null
  critic_api_key_env: null
  workers: 4
  max_revisions: 2
  timeout: 180

question:
  api_base: null
  model: null
  critic_api_base: null
  critic_model: null
  api_key_env: null
  workers: 4
  max_revisions: 2
  timeout: 180
