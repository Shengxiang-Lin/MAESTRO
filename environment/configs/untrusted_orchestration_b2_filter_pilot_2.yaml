# Stage-4 B2 filter-witness experiment: 2 frozen Scenes, template only.
# Retains the original Stage-3 trusted prefix and one-fault/one-decision path.
# Run on an isolated output directory, never overwrite the 10-scene bank.
version: 1

input:
  scenes: environment/data/stage1/questions/scenes.jsonl
  reports: environment/data/pilots/qwen_stage234_10/stage2/subtasks.jsonl
  # Optional reviewed Stage-3 reference for exact clean/fault pairing.
  # Null keeps deterministic Stage-4 bootstrap for independent experiments.
  clean_episodes: environment/data/pilots/qwen_stage234_10/stage3/episodes.jsonl

generation:
  output_dir: environment/data/stage4_b2_filter_pilot_2
  max_scenes: 2
  branches_per_scene: 2   # inspect early discovery feedback waves
  seed: 17
  # Enumerate executable one-atom variants with provenance-grounded distractors.
  max_candidates_per_round: null  # enumerate every executable one-atom fault
  max_distractors_per_fault: 4  # bounded source-backed variants for fast pilot
  max_selected_per_round: null  # diversify legal next-decision candidates per feedback wave
  target_main_turns: 24  # bounded template pilot
  atomic_fault_kinds:
    - wrong_retrieval
  max_rounds: 16
  max_cost: 80
  max_retries: 1
  max_parallel_tasks: 4
  workers: 2
  mode: template         # no LLM service is required
  report_max_revisions: 2
  main_max_revisions: 2
  sub_model: local-qwen3.5-9b
  model_alias: model_1
  overwrite: false
  no_progress: false

# Stage-4 Main reasoning Author + independent Critic.
model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null  # inherit author_api_base
  critic_model: local-qwen3.5-9b
  temperature: 0.1
  author_max_tokens: 2800
  critic_max_tokens: 1200
  api_key_env: null

# Stage-4 Sub-Agent report naturalization Author + independent Critic.
subagent_model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null  # inherit author_api_base
  critic_model: local-qwen3.5-9b
  temperature: 0.1
  author_max_tokens: 2800
  critic_max_tokens: 1200
  api_key_env: null
