# Canonical Stage 1: output-first Goal -> typed evidence -> composed World
# -> scoped evidence views -> original Compiler/Replay and Stage 2–4 contracts.
# YAGO supplies observed relation vocabulary and world-structure statistics,
# NOT mandatory factual paths. Recombined entities/relations are new facts
# within the generated scenario; their synthetic origin remains private.
version: 1

input:
  max_records: 1000

generation:
  output_dir: environment/data/stage1
  target: 100
  seed: 17
  difficulty_mix: [0, 50, 50]
  overwrite: false
  flush_every: 1
  no_progress: false
  knowledge_yago: data/world-source/YAGO-4.6
  knowledge_max_triples: 1000000
  knowledge_max_edges: 250000
  knowledge_min_hops: 2
  knowledge_max_hops: 3

scenario:
  api_base: null
  model: null
  critic_api_base: null
  critic_model: null
  api_key_env: null
  critic_api_key_env: null
  workers: 4
  max_revisions: 2
  timeout: 180

question:
  # Default Question Author/Critic: DashScope qwen3.8-flash, selected from
  # the shared model registry. Base URL, temperature and top_p are resolved
  # from config/model_config.yaml; never duplicate provider settings here.
  # Export DASHSCOPE_API_KEY before generating reviewed Questions.
  # Frozen Task Plan, World, Evidence and Gold remain code-owned.
  registry: config/model_config.yaml
  api_base: null
  model: qwen3.8-flash
  critic_api_base: null
  critic_model: qwen3.8-flash
  api_key_env: DASHSCOPE_API_KEY
  critic_api_key_env: DASHSCOPE_API_KEY
  workers: 4
  max_revisions: 2
  timeout: 180
