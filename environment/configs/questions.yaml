# Stage 1: generate 500 candidate ProblemSpecs, then independently review the questions.
# The reviewed Scene count can be lower than generation.target; downstream stages
# only consume accepted, published Scenes. All paths are repository-root-relative.
version: 1

input:
  max_records: 2000  # room for rejected/duplicate candidate ProblemSpecs

generation:
  output_dir: environment/data/batches/candidate_500/stage1
  target: 500
  seed: 17
  difficulty_mix: [0, 50, 50]
  overwrite: false
  flush_every: 1
  no_progress: false
  knowledge_yago: data/world-source/YAGO-4.6
  knowledge_max_triples: 1000000
  knowledge_max_edges: 250000
  knowledge_min_hops: 2
  knowledge_max_hops: 3

scenario:
  api_base: null
  model: null
  critic_api_base: null
  critic_model: null
  api_key_env: null
  critic_api_key_env: null
  workers: 4
  max_revisions: 2
  timeout: 180

question:
  registry: null
  api_base: http://127.0.0.1:8807/v1
  model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: local-qwen3.5-9b
  api_key_env: null
  critic_api_key_env: null
  workers: 10
  max_revisions: 2
  timeout: 180
