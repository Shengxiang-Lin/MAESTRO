# Canonical Stage 1 V1.3: typed Macro operators, diverse numeric witnesses, semantic lock.
# Paths are relative to the repository root; secrets must be environment vars.
version: 1

input:
  mmqa: data/world-source/MultiModalQA/MMQA_train.jsonl.gz
  max_records: 1000

generation:
  output_dir: environment/data/maestro_stage1_current_v1_3_100
  target: 100
  seed: 17
  macro_planning_share: 100  # use the current Macro planning grammar for medium/hard tasks
  operator_grammar_share: 100  # typed query-plan variants for medium/hard
  numeric_goal_diversity_share: 100  # versioned, non-constant comparison and completion-rate witnesses
  question_semantic_lock_share: 100  # exact one-output, rounding and evidence-predicate constraints
  difficulty_mix: [17, 33, 50]  # Initial candidate mix only; never an accepted quota
  overwrite: false
  flush_every: 1   # persist every completed LLM decision (safe to resume)
  no_progress: false

scenario:
  api_base: http://127.0.0.1:8807/v1
  model: local-qwen3.5-9b
  critic_api_base: null       # Same endpoint as Author
  critic_model: null          # Same model as Author
  api_key_env: null           # e.g. DASHSCOPE_API_KEY for a remote model
  critic_api_key_env: null
  workers: 8
  max_revisions: 2
  timeout: 180

question:
  api_base: http://127.0.0.1:8807/v1
  model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: null
  api_key_env: null
  workers: 8
  max_revisions: 2
  timeout: 180
