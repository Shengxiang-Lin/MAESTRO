# Stage 3: freeze dependency-safe dispatch and author only public,
# evidence-grounded Main reasoning and scoped Sub-Agent task prose.
# Accepted episodes and accepted_scenes.jsonl are rebuilt atomically from journals.
version: 1

input:
  scenes: environment/data/batches/candidate_500/stage1/questions/scenes.jsonl
  reports: environment/data/batches/candidate_500/stage2/subtasks.jsonl

generation:
  output_dir: environment/data/batches/candidate_500/stage3
  max_scenes: 500
  workers: 8
  mode: llm
  freeze_dispatch: true
  max_revisions: 2
  max_attempts: 16
  sub_model: local-qwen3.5-9b
  model_alias: model_1
  overwrite: false
  no_progress: false
  verbose_progress: false

model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: local-qwen3.5-9b
  api_key_env: null
  temperature: 0.1
  author_max_tokens: 2800
  critic_max_tokens: 1200
