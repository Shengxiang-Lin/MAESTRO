# Stage-3 Qwen pilot: 10 Scene Clean References, using the same Stage-2 bank.
# Base orchestration: trusted Main-Agent decisions from reviewed Sub-Agent reports.
# All paths are relative to the MAESTRO repository root.
version: 1

input:
  scenes: environment/data/stage1/questions/scenes.jsonl
  reports: environment/data/pilots/qwen_stage234_10/stage2/subtasks.jsonl

generation:
  output_dir: environment/data/pilots/qwen_stage234_10/stage3
  max_scenes: 10  # reuse first 10 accepted Stage-1 Scenes
  workers: 10
  mode: llm           # llm or template
  freeze_dispatch: true  # Freeze DAG batches/models/tools; LLM authors reasoning + scoped task prose
  max_revisions: 2
  max_attempts: 10
  sub_model: local-qwen3.5-9b
  model_alias: model_1
  overwrite: false
  no_progress: false
  verbose_progress: false

model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null  # null: same endpoint as author
  critic_model: local-qwen3.5-9b
  api_key_env: null
  temperature: 0.1
  author_max_tokens: 2800
  critic_max_tokens: 1200
