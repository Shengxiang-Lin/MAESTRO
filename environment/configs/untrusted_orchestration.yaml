# Stage 4: one faulty latest Sub-Agent feedback batch -> one reviewed
# Main next-decision (NOT a full multi-round recovery trajectory).
# Only accepted Stage-3 Scenes are input; every Scene must match its frozen,
# independently reviewed Stage-3 Clean Reference and Stage-2 reports.
version: 1

input:
  scenes: environment/data/batches/candidate_500/stage3/accepted_scenes.jsonl
  reports: environment/data/batches/candidate_500/stage2/subtasks.jsonl
  clean_episodes: environment/data/batches/candidate_500/stage3/episodes.jsonl

generation:
  output_dir: environment/data/batches/candidate_500/stage4
  max_scenes: 500
  branches_per_scene: null
  seed: 17
  # Production bounded enumeration: B3 targets are ordered before other classes.
  # Change these only in a new output directory; caps limit candidate coverage.
  max_candidates_per_round: 24
  max_distractors_per_fault: 8
  max_selected_per_round: 2
  target_main_turns: 2000  # global positive Main-turn budget, not 2000 Scenes
  atomic_fault_kinds:
    - no_result
    - incomplete_retrieval
    - done_but_incomplete
    - wrong_retrieval
    - computation_error
    - wrong_entity_binding
    - report_missing
    - result_summary_conflict
    - fabricated_claim
  max_rounds: 16
  max_cost: 80
  max_retries: 1
  max_parallel_tasks: 4
  workers: 4
  mode: llm
  report_max_revisions: 2
  main_max_revisions: 2
  sub_model: local-qwen3.5-9b
  model_alias: model_1
  overwrite: false
  no_progress: false

model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: local-qwen3.5-9b
  temperature: 0.1
  author_max_tokens: 2800
  critic_max_tokens: 1200
  api_key_env: null

subagent_model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: local-qwen3.5-9b
  temperature: 0.1
  author_max_tokens: 2800
  critic_max_tokens: 1200
  api_key_env: null
