# MAESTRO trusted evidence -> untrusted Main decision training.
# Inputs: Stage-1 frozen scenes + Stage-2 reviewed reports ONLY.
# A deterministic clean O1 prefix is compiled internally; Stage 3 is not run.
version: 1

input:
  scenes: environment/data/stage1/questions/scenes.jsonl
  reports: environment/data/stage2/subtasks.jsonl
  # Optional reviewed Stage-3 reference for exact clean/fault pairing.
  # Null keeps deterministic Stage-4 bootstrap for independent experiments.
  clean_episodes: null

generation:
  output_dir: environment/data/stage4
  max_scenes: null
  branches_per_scene: null  # optional debugging cap
  seed: 17
  # Enumerate executable one-atom variants with provenance-grounded distractors.
  max_candidates_per_round: 24
  max_distractors_per_fault: 2
  max_selected_per_round: 1
  max_language_attempts_per_round: 3
  atomic_fault_kinds:
    - no_result
    - incomplete_retrieval
    - wrong_retrieval
    - wrong_entity_binding
    - report_missing
    - result_summary_conflict
    - fabricated_claim
  max_rounds: 16
  max_cost: 80
  max_retries: 1
  max_parallel_tasks: 4
  workers: 8
  mode: llm              # reviewed Sub-Agent and Main language generation
  report_max_revisions: 2
  main_max_revisions: 2
  sub_model: qwen3-8b
  model_alias: model_1
  overwrite: false
  no_progress: false

# Stage-4 Main reasoning Author + independent Critic.
model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: null
  temperature: 0.3
  author_max_tokens: 2800
  critic_max_tokens: 1200
  api_key_env: OPENAI_API_KEY

# Stage-4 Sub-Agent report naturalization Author + independent Critic.
subagent_model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: null
  temperature: 0.3
  author_max_tokens: 2800
  critic_max_tokens: 1200
  api_key_env: OPENAI_API_KEY
