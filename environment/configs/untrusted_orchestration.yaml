# Stage-4 pilot: short, causally replayed single-fault branches.
# MAESTRO trusted evidence -> untrusted Main decision training.
# Pilot: first 10 Stage-1 Scenes + reviewed Stage-2 reports and Stage-3 clean episodes.
# Stage 4 checks and reuses the actual Stage-3 Clean Reference.
version: 1

input:
  scenes: environment/data/stage1/questions/scenes.jsonl
  reports: environment/data/pilots/qwen_stage234_10/stage2/subtasks.jsonl
  # Optional reviewed Stage-3 reference for exact clean/fault pairing.
  # Null keeps deterministic Stage-4 bootstrap for independent experiments.
  clean_episodes: environment/data/pilots/qwen_stage234_10/stage3/episodes.jsonl

generation:
  output_dir: environment/data/pilots/qwen_stage234_10/stage4
  max_scenes: 10
  branches_per_scene: 3  # spread forks across early/middle/late feedback
  round_sampling_strategy: evidence_aware
  max_post_fork_rounds: 8  # unresolved if horizon expires; no fake completion
  seed: 17
  # Enumerate executable one-atom variants with provenance-grounded distractors.
  max_candidates_per_round: 12
  max_distractors_per_fault: 1
  max_selected_per_round: 1
  selection_strategy: stratified
  max_diagnostics_per_scene: 1  # reviewed evidence-only negatives; never positive SFT
  max_language_attempts_per_round: 2
  atomic_fault_kinds:
    - no_result
    - incomplete_retrieval
    - wrong_retrieval
    - wrong_entity_binding
    - report_missing
    - result_summary_conflict
    - fabricated_claim
  max_rounds: 16
  max_cost: 80
  max_retries: 1
  max_parallel_tasks: 4
  workers: 4
  mode: llm              # reviewed Sub-Agent and Main language generation
  report_max_revisions: 2
  main_max_revisions: 2
  sub_model: local-qwen3.5-9b
  model_alias: model_1
  overwrite: false
  no_progress: false

# Stage-4 Main reasoning Author + independent Critic.
model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null  # inherit author_api_base
  critic_model: local-qwen3.5-9b
  temperature: 0.1
  author_max_tokens: 2800
  critic_max_tokens: 1200
  api_key_env: null

# Stage-4 Sub-Agent report naturalization Author + independent Critic.
subagent_model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null  # inherit author_api_base
  critic_model: local-qwen3.5-9b
  temperature: 0.1
  author_max_tokens: 2800
  critic_max_tokens: 1200
  api_key_env: null
