# Base orchestration: trusted Main-Agent decisions from reviewed Sub-Agent reports.
# All paths are relative to the MAESTRO repository root.
version: 1

input:
  scenes: environment/data/maestro_stage1_current_v1_4_100/questions/scenes.jsonl
  reports: environment/data/maestro_stage2_reports_v1_4_repaired/subtasks.jsonl

generation:
  output_dir: environment/data/maestro_stage3_v1_4_100
  max_scenes: null    # null means every accepted Scene
  workers: 8
  mode: llm           # llm or template
  freeze_dispatch: true  # V1.4: code owns task batches; LLM writes reasoning only
  max_revisions: 2
  max_attempts: 16
  sub_model: qwen3-8b
  model_alias: model_1
  overwrite: false
  no_progress: false
  verbose_progress: false

model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null   # null: same as author
  critic_model: null      # null: same as author
  api_key_env: OPENAI_API_KEY
  temperature: 0.4
  author_max_tokens: 2800
  critic_max_tokens: 1200
