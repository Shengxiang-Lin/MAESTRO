# MAESTRO: persistent epistemic state + prospective projection v4.
# All names below are real model identifiers from config/model_config.yaml.
main_model: "qwen3.8-max"
sub_models:
  - "qwen3.8-max"

# Web-connected tools: provider controls where evidence comes from; model controls
# the LLM used by providers that require one.
search:
  provider: "dashscope"   # dashscope | serper
  model: "qwen3.7-flash" # ignored when provider=serper

browse:
  provider: "dashscope"   # dashscope | jina
  model: "qwen3.7-flash" # jina uses this model after reading the page

# Models used by non-web OmniGAIA tools.
tool_models:
  image_analysis: "qwen3.7-flash"
  audio_analysis: "qwen3.5-omni-flash"
  video_vision: "qwen3.7-flash"
  video_audio: "qwen3.5-omni-flash"
  video_summary: "qwen3.7-flash"

evaluation_model: "qwen3.7-plus"
trace_summary_model: "qwen3.7-plus"

dataset_path: "data/OmniGAIA/test_metadata.jsonl"
attachments_dir: "data/OmniGAIA"
level_filter: null
# Pretest; for final evaluation use data/OmniGAIA/splits/final_100_ids.txt.
task_ids_file: "data/OmniGAIA/splits/pretest_60_ids.txt"
max_tasks: null
max_attempts: 10
max_concurrency: 10

result_folder: "logs/omnigaia_orchestra_epistemic_projection_v4"
trajectory_folder: "logs/omnigaia_orchestra_epistemic_projection_v4/trajectories"

prospective:
  enabled: true
  max_prompt_results: 12
  max_prompt_state_chars: 9000
  max_source_ids_per_result: 12
  max_epistemic_bindings: 8
  max_belief_history: 4
  max_evidence_attempts_per_target: 6
  max_future_requirements: 4
  max_critical_dependencies: 3
  max_tasks_per_action: 5
  max_evidence_refs: 6
  completion_consistency_check: true
  execution_projection_enabled: true
  strict_provider_diversity: true
  blind_requery: true
