# MAESTRO / Stage 1 — Generate Question.
# Paths are relative to the repository root; secrets must be environment vars.
version: 1

input:
  mmqa: data/world-source/MultiModalQA/MMQA_train.jsonl.gz
  max_records: 1000

generation:
  output_dir: envir/data/maestro_question_final_100
  target: 100
  seed: 17
  clue_chain_share: 0  # opt-in percentage of MEDIUM scenes
  evidence_graph_share: 0  # opt-in MEDIUM/HARD typed random evidence DAGs
  macro_first_share: 0  # v1: legacy frozen Macro DAG pilot
  macro_first_v2_share: 0  # v2: varied goals, per-Macro evidence and typed multimodal tasks
  difficulty_mix: [17, 33, 50]  # Target accepted mix: easy/medium/hard ≈ 1:2:3
  accepted_difficulty_quotas: true  # Limited surplus candidates to fill accepted slots
  quota_candidate_multiplier: 2  # Up to 200 attempted for 100 requested; never unlimited
  overwrite: false
  flush_every: 1   # persist every completed LLM decision (safe to resume)
  no_progress: false

scenario:
  api_base: http://127.0.0.1:8807/v1
  model: local-qwen3.5-9b
  critic_api_base: null       # Same endpoint as Author
  critic_model: null          # Same model as Author
  api_key_env: null           # e.g. DASHSCOPE_API_KEY for a remote model
  critic_api_key_env: null
  workers: 8
  max_revisions: 2
  timeout: 180

question:
  api_base: http://127.0.0.1:8807/v1
  model: local-qwen3.5-9b
  critic_api_base: null
  critic_model: null
  api_key_env: null
  workers: 8
  max_revisions: 2
  timeout: 180
