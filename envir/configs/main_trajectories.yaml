# Trusted Main-Agent decision trajectories from reviewed Sub-Agent reports.
# All paths are relative to the MAESTRO repository root.
version: 1

input:
  scenes: envir/data/maestro_current_100/questions/scenes.jsonl
  reports: envir/data/maestro_subagent_reports_100/subtasks.jsonl

generation:
  output_dir: envir/data/maestro_main_trajectories_100
  max_scenes: null    # null means every accepted Scene
  workers: 4
  mode: llm           # llm or template
  max_revisions: 2
  max_attempts: 16
  sub_model: qwen3-8b
  model_alias: model_1
  overwrite: false
  no_progress: false
  verbose_progress: false

model:
  author_api_base: http://127.0.0.1:8807/v1
  author_model: local-qwen3.5-9b
  critic_api_base: null   # null: same as author
  critic_model: null      # null: same as author
  api_key_env: OPENAI_API_KEY
  temperature: 0.4
