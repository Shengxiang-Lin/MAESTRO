# Frozen OmniGAIA final / Orchestra-o1.
# Orchestra-o1: Qwen3.8-Max Main-Agent + local Qwen3.8-27B-FP8 Sub-Agent.
# Metadata source: data/OmniGAIA/test_metadata.json (converted losslessly to JSONL).
main_model: "qwen3.8-max"
sub_models:
  - "local-qwen-27b"

models:
  local-qwen-27b:
    model_path: "${QWEN3_27B_MODEL_PATH}"
    gpus: [0]
    tensor_parallel_size: 1
    dtype: "auto"
    quantization: "fp8"
    max_model_len: 32768
    max_num_seqs: 10
    gpu_memory_utilization: 0.90

search:
  provider: "dashscope"
  model: "qwen3.7-flash"

browse:
  provider: "dashscope"
  model: "qwen3.7-flash"

tool_models:
  image_analysis: "qwen3.7-flash"
  audio_analysis: "qwen3.5-omni-flash"
  video_vision: "qwen3.7-flash"
  video_audio: "qwen3.5-omni-flash"
  video_summary: "qwen3.7-flash"
evaluation_model: "qwen3.7-plus"

dataset_type: "OmniGAIA"
dataset_path: "data/OmniGAIA/test_metadata.jsonl"
attachments_dir: "data/OmniGAIA"
level_filter: null
# Fixed OmniGAIA final evaluation (100 questions).
task_ids_file: "data/OmniGAIA/splits/final_100_ids.txt"
max_tasks: null
max_attempts: 10
max_concurrency: 10
result_folder: "logs/omnigaia_final/omnigaia_o1_qwen38_max_local_fp8_10"
trajectory_folder: "logs/omnigaia_final/omnigaia_o1_qwen38_max_local_fp8_10/trajectories"
