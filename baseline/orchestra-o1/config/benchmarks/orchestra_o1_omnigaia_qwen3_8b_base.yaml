# OmniGAIA baseline with Orchestra-o1 and a local Qwen3-8B MainAgent.
# Set QWEN3_8B_MODEL_PATH or replace model_path with an absolute local path.
main_model: "qwen3-8b-local"
sub_models:
  - "qwen3.8-max"

# Experiment-local model definitions override/extend config/model_config.yaml.
# backend: vllm means the benchmark launcher starts or reuses the service.
models:
  qwen3-8b-local:
    backend: vllm
    model_path: "${QWEN3_8B_MODEL_PATH}"
    served_model_name: "qwen3-8b-local"
    host: "127.0.0.1"
    port: 8803
    gpus: [0]
    dtype: "bfloat16"
    gpu_memory_utilization: 0.80
    max_model_len: 16384
    max_num_seqs: 4
    max_num_batched_tokens: 4096
    reasoning_parser: "qwen3"
    enforce_eager: true
    reuse_existing: true
    auto_start: true
    startup_timeout: 900
    shutdown_on_exit: false
    extra_body:
      chat_template_kwargs:
        enable_thinking: true

tool_models:
  image_analysis: "qwen3.7-flash"
  audio_analysis: "qwen3.5-omni-flash"
  video_vision: "qwen3.7-flash"
  video_audio: "qwen3.5-omni-flash"
  video_summary: "qwen3.7-flash"

evaluation_model: "qwen3.7-plus"

dataset_path: "data/OmniGAIA/test_metadata.jsonl"
attachments_dir: "data/OmniGAIA"
level_filter: null

max_tasks: 360
max_attempts: 10
max_concurrency: 5

result_folder: "logs/omnigaia_orchestra_o1_qwen3_8b_base"
trajectory_folder: "logs/omnigaia_orchestra_o1_qwen3_8b_base/trajectories"
