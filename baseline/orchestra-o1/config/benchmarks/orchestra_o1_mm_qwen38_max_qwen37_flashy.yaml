# MM-BrowseComp configuration; model roles can match your existing experiment.
main_model: "qwen3.8-max"
sub_models:
  - "qwen3.7-flash"


search:
  provider: "dashscope"
  model: "qwen3.7-flash"

browse:
  provider: "dashscope"
  model: "qwen3.7-flash"

tool_models:
  image_analysis: "qwen3.7-flash"
  audio_analysis: "qwen3.5-omni-flash"
  video_vision: "qwen3.7-flash"
  video_audio: "qwen3.5-omni-flash"
  video_summary: "qwen3.7-flash"

evaluation_model: "qwen3.7-plus"

dataset_type: "MM-BrowseComp"
# Accepts JSON, plaintext JSONL, or the official encrypted JSONL.
dataset_path: "data/MM-BrowseComp/data/MMBrowseComp_400_decrypted.jsonl"
dataset_jsonl_path: "data/MM-BrowseComp/data/test_metadata.jsonl"
attachments_dir: "data/MM-BrowseComp"
level_filter: null

max_tasks: 10
max_attempts: 10
max_concurrency: 10

result_folder: "logs/mm_browsecomp_orchestra_o1_qwen37_plus_local_qwen35_9b"
trajectory_folder: "logs/mm_browsecomp_orchestra_o1_qwen37_plus_local_qwen35_9b/trajectories"
