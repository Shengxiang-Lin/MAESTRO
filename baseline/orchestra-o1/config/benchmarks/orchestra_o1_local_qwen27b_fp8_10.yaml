# Orchestra-o1: local Qwen3.8-27B-FP8 for both Main-Agent and Sub-Agents.
# Main/Sub share one vLLM service across GPUs 0 and 1 (48 GiB each).
# Metadata source: data/OmniGAIA/test_metadata.json (converted losslessly to JSONL).
main_model: "local-qwen-27b"
sub_models:
  - "local-qwen-27b"

models:
  local-qwen-27b:
    model_path: "/root/autodl-tmp/MAESTRO/base_models/Qwen3.8-27B-FP8"
    gpus: [0, 1]
    tensor_parallel_size: 2
    dtype: "auto"
    quantization: "fp8"
    max_model_len: 32768
    max_num_seqs: 10
    gpu_memory_utilization: 0.90
    env:
      VLLM_USE_FLASHINFER_SAMPLER: "0"

tool_models:
  search: "qwen3.7-flash"
  browse: "qwen3.7-flash"
  image_analysis: "qwen3.7-flash"
  audio_analysis: "qwen3.5-omni-flash"
  video_vision: "qwen3.7-flash"
  video_audio: "qwen3.5-omni-flash"
  video_summary: "qwen3.7-flash"
evaluation_model: "qwen3.7-plus"
trace_summary_model: "qwen3.7-plus"

dataset_type: "OmniGAIA"
dataset_path: "data/OmniGAIA/test_metadata.jsonl"
attachments_dir: "data/OmniGAIA"
level_filter: null
max_tasks: 10
max_attempts: 10
max_concurrency: 10
result_folder: "logs/omnigaia_o1_local_qwen27b_fp8_10"
trajectory_folder: "logs/omnigaia_o1_local_qwen27b_fp8_10/trajectories"
