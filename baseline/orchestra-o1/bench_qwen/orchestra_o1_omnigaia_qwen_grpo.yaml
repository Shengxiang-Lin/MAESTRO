# OmniGAIA configuration with the local Qwen3-8B GRPO model as MainAgent.
# Deployment details are defined in config/model_config.yaml.
# Before running:
#   export QWEN3_8B_GRPO_MODEL_PATH=/path/to/exported/qwen3-8b-grpo
main_model: "qwen3-8b-grpo-local"
sub_models:
  - "deepseek-v4-flash-0731"

tool_models:
  image_analysis: "qwen3.7-flash"
  audio_analysis: "qwen3.5-omni-flash"
  video_vision: "qwen3.7-flash"
  video_audio: "qwen3.5-omni-flash"
  video_summary: "qwen3.7-flash"

evaluation_model: "qwen3.7-plus"

dataset_path: "data/OmniGAIA/test_metadata.jsonl"
attachments_dir: "data/OmniGAIA"
level_filter: null
max_tasks: 360
max_attempts: 10
max_concurrency: 5
result_folder: "logs/omnigaia_qwen_8b_grpo"
trajectory_folder: "logs/omnigaia_qwen_8b_grpo/trajectories"
