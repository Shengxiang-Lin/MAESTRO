name: MAESTRO 8B latent-risk unit tests

on:
  pull_request:
    paths:
      - "train_maestro_8b/**"
      - ".github/workflows/train-maestro-8b-tests.yml"
  push:
    branches: [main]
    paths:
      - "train_maestro_8b/**"
      - ".github/workflows/train-maestro-8b-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile training modules
        run: python -m compileall -q train_maestro_8b
      - name: Test risk schema, history alignment and masks
        run: python -m unittest train_maestro_8b.test_reliability -v

  risk-model-gradient:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify one-pass MIL and backbone gradients
        run: python -m unittest train_maestro_8b.test_risk_model -v

  o1-prompt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal environment dependencies
        run: python -m pip install "tqdm>=4.65" "PyYAML>=6.0" "pydantic>=2,<3" "openai>=1,<3"
      - name: Test real O1 history and round risk labels
        run: python -m unittest train_maestro_8b.test_runtime_alignment -v
