name: MAESTRO 8B latent-risk unit tests

on:
  pull_request:
    paths:
      - "train_maestro_8b/**"
      - ".github/workflows/train-maestro-8b-tests.yml"
  push:
    branches: [main]
    paths:
      - "train_maestro_8b/**"
      - ".github/workflows/train-maestro-8b-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile training modules
        run: python -m compileall -q train_maestro_8b
      - name: Test risk schema, history alignment and masks
        run: python -m unittest train_maestro_8b.test_reliability train_maestro_8b.test_candidate_alignment -v

  risk-head-gradient:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install feature-cache progress dependency
        run: python -m pip install tqdm
      - name: Verify frozen-backbone MIL and Risk Head gradients
        run: python -m unittest train_maestro_8b.test_risk_model train_maestro_8b.test_feature_cache train_maestro_8b.test_grpo_trainer -v

  o1-prompt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal environment dependencies
        run: python -m pip install "tqdm>=4.65" "PyYAML>=6.0" "pydantic>=2,<3" "openai>=1,<3"
      - name: Test real O1 history and round risk labels
        run: python -m unittest train_maestro_8b.test_runtime_alignment train_maestro_8b.test_orchestration_reward -v

  qwen3-cache-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install model integration dependencies
        run: python -m pip install "transformers==5.15.1" "peft==0.20.0" "accelerate>=1.15,<2"
      - name: Verify real tiny Qwen3 + LoRA cache semantics
        run: python -m unittest train_maestro_8b.test_risk_policy -v

  trl-grpo-cpu-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install TRL 1.15 and compatible model dependencies
        run: python -m pip install "trl>=1.15,<1.16" "transformers>=5.17,<5.18" "peft>=0.20,<0.21" "accelerate>=1.15,<2"
      - name: Verify one real GRPOConfig/Trainer optimization update
        run: python -m unittest train_maestro_8b.test_trl_integration -v
