name: Regenerate seeded benchmark ID manifests

on:
  push:
    branches:
      - feat/seeded-statistical-benchmark-splits
    paths:
      - benchmark/experiment_splits.py
      - .github/workflows/regenerate-seeded-benchmark-splits.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official metadata (ephemeral; do not commit)
        run: |
          mkdir -p "$RUNNER_TEMP/datasets"
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/RUC-NLPIR/OmniGAIA/main/data/test_metadata.json \
            -o "$RUNNER_TEMP/datasets/omnigaia.json"
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/MMBrowseComp/MM-BrowseComp/main/data/MMBrowseComp_400.jsonl \
            -o "$RUNNER_TEMP/datasets/mm_browsecomp.jsonl"
      - name: Generate and independently verify deterministic manifests
        run: |
          python benchmark/experiment_splits.py --seed 20261115 \
            --omnigaia-meta "$RUNNER_TEMP/datasets/omnigaia.json" \
            --mm-meta "$RUNNER_TEMP/datasets/mm_browsecomp.jsonl"
          python benchmark/experiment_splits.py --seed 20261115 --check \
            --omnigaia-meta "$RUNNER_TEMP/datasets/omnigaia.json" \
            --mm-meta "$RUNNER_TEMP/datasets/mm_browsecomp.jsonl"
      - name: Record IDs in action logs as fallback
        run: |
          for file in data/OmniGAIA/splits/*.txt data/MM-BrowseComp/splits/*.txt; do
            echo "=== $file ==="
            paste -sd, "$file"
          done
      - name: Commit updated IDs to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/OmniGAIA/splits/pretest_60_ids.txt \
            data/OmniGAIA/splits/final_100_ids.txt \
            data/MM-BrowseComp/splits/final_100_ids.txt
          if ! git diff --cached --quiet; then
            git commit -m "testdata: regenerate splits from official statistics and seed 20261115"
            git push origin HEAD:feat/seeded-statistical-benchmark-splits
          fi
