name: Envir subtask-first tests

on:
  pull_request:
    paths:
      - "envir/**"
      - ".github/workflows/envir-tests.yml"
  push:
    branches: [main]
    paths:
      - "envir/**"
      - ".github/workflows/envir-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envir-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reused-parser dependency
        run: python -m pip install "tqdm>=4.65"
      - name: Compile envir
        run: python -m compileall -q envir
      - name: Run isolated envir tests
        run: python -m unittest discover -s envir/tests -p 'test_*.py' -v
