name: Reliability Baselines CPU checks

on:
  pull_request:
    paths:
      - "baseline/a-trust/**"
      - "baseline/omni-decision/**"
      - "baseline/propuq-mas/**"
      - "baseline/hassum/**"
      - "baseline/verifymas/**"
      - "baseline/reliability_*.py"
      - "baseline/test_reliability_baselines.py"
      - ".github/workflows/reliability-baselines-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pydantic>=2,<3" "openai>=1,<4" "PyYAML>=6" "loguru>=0.7" "numpy>=1.26"
      - name: Compile new baseline sources
        run: python -m compileall -q baseline/reliability_core.py baseline/reliability_benchmark.py baseline/a-trust baseline/omni-decision baseline/propuq-mas baseline/hassum baseline/verifymas
      - name: CPU contract tests
        run: python -m unittest discover -s baseline -p 'test_reliability_baselines.py' -v
