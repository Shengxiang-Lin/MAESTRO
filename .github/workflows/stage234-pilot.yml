name: MAESTRO Stage 2-4 paired smoke pilot

on:
  pull_request:
    paths:
      - "environment/tests/stage234_pilot.py"
      - ".github/workflows/stage234-pilot.yml"
      - "environment/implement_subtask/**"
      - "environment/base_orchestration/**"
      - "environment/untrusted_orchestration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage234-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install environment dependencies
        run: python -m pip install "tqdm>=4.65" "PyYAML>=6.0" "pydantic>=2,<3" "openai>=1,<3" "pyoxigraph>=0.5,<0.6"
      - name: Run four-scene Stage 2-4 paired offline pilot
        run: |
          python -m environment.tests.stage234_pilot \
            --count 4 --feedback-rounds 2 \
            --output-dir environment/data/stage234_smoke_ci
      - name: Upload pilot diagnostics and a few example trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage234-smoke-ci
          retention-days: 14
          path: |
            environment/data/stage234_smoke_ci/stage234_pilot_summary.json
            environment/data/stage234_smoke_ci/stage3/episodes.jsonl
            environment/data/stage234_smoke_ci/stage3/main_turns.jsonl
            environment/data/stage234_smoke_ci/stage4/summary.json
            environment/data/stage234_smoke_ci/stage4/round_index.jsonl
            environment/data/stage234_smoke_ci/stage4/private/trusted_prefix_checks.jsonl
            environment/data/stage234_smoke_ci/stage4/private/paired_trajectories.jsonl
            environment/data/stage234_smoke_ci/stage4/private/candidate_selection.jsonl
            environment/data/stage234_smoke_ci/stage4/episodes.jsonl
            environment/data/stage234_smoke_ci/stage4/main_turns.jsonl
