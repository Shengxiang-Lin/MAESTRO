name: Environment unit tests

on:
  pull_request:
    paths:
      - "environment/**"
      - "base/**"
      - "orchestra/**"
      - "train_maestro_8b/**"
      - ".github/workflows/environment-tests.yml"
  push:
    branches: [main]
    paths:
      - "environment/**"
      - "base/**"
      - "orchestra/**"
      - "train_maestro_8b/**"
      - ".github/workflows/environment-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "environment/requirements.txt"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/requirements.txt "pydantic>=2,<3" "openai>=1,<3"
      - name: Compile environment source
        run: python -m compileall -q environment
      - name: Environment unit tests
        run: python -m unittest discover -s environment/tests -v
