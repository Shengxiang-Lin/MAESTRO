name: MAESTRO environment pipeline tests

on:
  pull_request:
    paths:
      - "environment/**"
      - "orchestra/**"
      - ".github/workflows/environment-tests.yml"
  push:
    branches: [main]
    paths:
      - "environment/**"
      - "orchestra/**"
      - ".github/workflows/environment-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "tqdm>=4.65" "PyYAML>=6.0" "pydantic>=2,<3" "openai>=1,<3" "pyoxigraph>=0.5,<0.6"
      - name: Compile environment
        run: python -m compileall -q environment
      - name: Run environment tests
        run: python -m unittest discover -s environment/tests -p 'test_*.py' -v
      - name: Run graph-grounded Macro v3 tests
        run: python -m unittest discover -s environment/macro_v3/tests -p 'test_*.py' -v
