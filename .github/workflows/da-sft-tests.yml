name: MAESTRO DA-SFT CPU contracts

on:
  pull_request:
    paths:
      - "environment/data_export/**"
      - "environment/tests/test_data_audit.py"
      - "baseline/da-sft/**"
      - ".github/workflows/da-sft-tests.yml"
  push:
    branches: [main]
    paths:
      - "environment/data_export/**"
      - "environment/tests/test_data_audit.py"
      - "baseline/da-sft/**"
      - ".github/workflows/da-sft-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  da-sft-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies (no GPU/Unsloth)
        run: python -m pip install "PyYAML>=6" "pyarrow>=15" "pydantic>=2,<3" "openai>=1,<3" "tqdm>=4.65"
      - name: Compile source
        run: python -m compileall -q environment/data_export environment/tests/test_data_audit.py baseline/da-sft
      - name: Unified DA-SFT data quality contracts
        run: python -m unittest environment.tests.test_data_audit -v
      - name: DA-SFT trainer contracts
        run: python -m unittest discover -s baseline/da-sft -p 'test_sft.py' -v
