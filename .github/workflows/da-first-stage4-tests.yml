name: DA-first Stage4 GRPO contract tests

on:
  pull_request:
    paths:
      - "dataset/**"
      - "baseline/da-grpo/**"
      - ".github/workflows/da-first-stage4-tests.yml"
  push:
    branches: [main]
    paths:
      - "dataset/**"
      - "baseline/da-grpo/**"
      - ".github/workflows/da-first-stage4-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Minimal offline dependencies
        run: python -m pip install "PyYAML>=6.0" "requests>=2.31" "tqdm>=4.65" "pydantic>=2,<3" "openai>=1,<3"
      - name: Compile dataset and trainer sources
        run: python -m compileall -q dataset baseline/da-grpo
      - name: Bash CLI and usage
        run: |
          bash -n baseline/da-grpo/run_stage4.sh
          bash baseline/da-grpo/run_stage4.sh help
          bash baseline/da-grpo/run.sh --help >/dev/null || true
      - name: Test Stage4 exporter and DA reward contract
        run: |
          python -m unittest dataset.test_prepare_da_grpo -v
          python -m unittest discover -s baseline/da-grpo -p 'test_*.py' -v
