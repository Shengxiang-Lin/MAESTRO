name: Temporary environment dependency audit snapshot
on:
  pull_request:
    paths:
      - ".github/workflows/environment-audit-snapshot.yml"
      - "environment/**"
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload source for offline dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: environment-source-audit
          retention-days: 2
          path: |
            environment/
            baseline/
            train_maestro_8b/
            orchestra/
            base/
            benchmark/
            dataset/
            config/
            .github/workflows/
            README.md
            requirements.txt
          if-no-files-found: error
